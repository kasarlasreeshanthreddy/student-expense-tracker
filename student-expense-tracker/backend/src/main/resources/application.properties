spring.application.name=student-expense-tracker
server.port=${PORT:8080}

# Local default: embedded H2 file database. Cloud hosts can override this with
# SPRING_DATASOURCE_URL=jdbc:h2:mem:expenses;DB_CLOSE_DELAY=-1
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/student_expense_tracker;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=always

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
